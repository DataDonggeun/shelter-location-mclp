<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>행정동 경계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 1920x1080 캔버스. 제목과 카드는 다른 장과 같고, 카드 안은 지도 + 숫자 타일 + 동 이름 칩 */
:root {
  --main: #223a65;
  --title: #2a2d33;
  --bar: #2a2d33;
  --text: #4a4f58;
  --sub: #5d6676;
  --muted: #8a93a3;
  --pill: #dde6f3;
  --edge: #7fbcf0;
  --tint: #eef3fa;
  --few: #cde2fb;     /* 지도 1곳 색 */
  --many: #104281;    /* 지도 7곳 이상 색 */
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #2b2a28; overflow: hidden; }
body { font-family: "Pretendard", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; }

.stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; }
.slide {
  position: absolute; inset: 0; overflow: hidden;
  background:
    radial-gradient(1350px 780px at 30% 0%, #ffffff 0%, rgba(255,255,255,0) 70%),
    radial-gradient(1050px 900px at 100% 100%, #8ec5f4 0%, rgba(142,197,244,0) 70%),
    linear-gradient(120deg, #e3f0fd 0%, #f4f9ff 40%, #b4d8f8 100%);
}
.bar { position: absolute; left: 120px; top: 92px; width: 12px; height: 62px; background: var(--bar); }
.ttl { position: absolute; left: 148px; top: 78px; margin: 0; font-size: 60px; font-weight: 700; letter-spacing: -0.02em; color: var(--title); }

.card {
  position: absolute; left: 76px; top: 210px; width: 1768px; height: 810px;
  background: #fff; border: 3px solid var(--edge); border-radius: 40px;
  padding: 36px 64px 40px 40px; display: flex; gap: 56px;
}

/* 왼쪽: 큰 지도 */
.left { flex: 0 0 900px; position: relative; display: flex; align-items: center; justify-content: center; padding-top: 74px; }
.left img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.left .pill { position: absolute; left: 24px; top: 6px; }
.pill { height: 60px; padding: 0 36px; border-radius: 30px; background: var(--pill); color: var(--main); font-size: 28px; display: inline-flex; align-items: center; }

/* 오른쪽 */
.right { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; position: relative; }
.lab { font-size: 23px; font-weight: 700; color: var(--muted); letter-spacing: 0.02em; }
.lead { max-width: 700px; margin: 12px 0 0; font-size: 28px; line-height: 1.6; font-weight: 600; color: var(--text); word-break: keep-all; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 44px; }
.tile { background: var(--tint); border-radius: 24px; padding: 26px 30px 24px; }
.tile .k { font-size: 22px; font-weight: 600; color: var(--sub); }
.tile .v { margin-top: 6px; font-size: 60px; font-weight: 800; color: var(--main); letter-spacing: -0.02em; line-height: 1.1; }
.tile .v small { font-size: 28px; font-weight: 700; margin-left: 2px; }

.chips { margin-top: 48px; display: flex; flex-direction: column; gap: 18px; }
.chips .line { display: flex; align-items: center; gap: 14px; }
.chips .line > span { flex: 0 0 170px; font-size: 23px; font-weight: 600; color: var(--sub); }
.chip { font-style: normal; height: 50px; padding: 0 24px; border-radius: 25px; font-size: 23px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.chip b { font-weight: 800; }
.chip.few { background: var(--few); color: var(--main); }
.chip.many { background: var(--many); color: #fff; }

.src { position: absolute; left: 0; bottom: 0; font-size: 19px; color: #5d7290; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <section class="slide">
    <div class="bar"></div><h1 class="ttl">행정동 경계</h1>
    <div class="card">
      <div class="left">
        <img src="../4_결과/강남구_행정동/02_행정동_경계.png" alt="">
        <div class="pill">강남구 행정동 경계</div>
      </div>
      <div class="right">
        <div class="lab">활용 목적</div>
        <p class="lead">형평성을 평가하는 단위로 행정동을 사용했다. 형평성 MCLP와 최저 행정동 커버율 지표가 이 경계를 기준으로 계산된다.</p>
        <div class="tiles">
          <div class="tile"><div class="k">강남구 행정동</div><div class="v">22<small>개</small></div></div>
          <div class="tile"><div class="k">동별 기존 쉼터</div><div class="v">1~15<small>곳</small></div></div>
        </div>
        <div class="chips">
          <div class="line"><span>쉼터가 적은 동</span><i class="chip few">신사동 <b>1곳</b></i><i class="chip few">대치1동 <b>1곳</b></i></div>
          <div class="line"><span>쉼터가 많은 동</span><i class="chip many">세곡동 <b>15곳</b></i><i class="chip many">역삼1동 <b>11곳</b></i></div>
        </div>
        <div class="src">자료: 통계지리정보서비스(SGIS) 강남구 행정동 경계, 서울시 무더위쉼터(OA-21065)</div>
      </div>
    </div>
  </section>
</div>
<script>
function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  document.getElementById("stage").style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit); fit();
</script>
</body>
</html>
